name: Cron Job

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:      
  repository_dispatch:     # BU SATIRI EKLEDİK
    types: [external_trigger] # BU İSİM ÖNEMLİ

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scripti çalıştır
        run: python cron.py
