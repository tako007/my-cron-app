name: Cron Job

on:
  schedule:
    - cron: "* * * * *"   # HER 1 DAKİKA
  workflow_dispatch:      # Manuel tetikleme için (çok faydalı)

jobs:
  run-cron:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scripti çalıştır
        run: python cron.py
