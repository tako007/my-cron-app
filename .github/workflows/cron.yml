name: Cron Job

on:

  workflow_dispatch:      
  repository_dispatch:
    types: [external_trigger]

jobs:
  run-cron:
    runs-on: ubuntu-latest
    # Burası önemli: Botun dosyayı güncelleyebilmesi için yazma izni veriyoruz
    permissions:
      contents: write

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scripti çalıştır
        run: python cron.py
        
      - name: Değişiklikleri Commit Et ve Pushla
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add runs.txt
          git commit -m "Cron: Log kaydı eklendi" || echo "Değişiklik yok"
          git push
